name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Smoke test
        run: |
          node -e "require('./db.js')" || (sleep 1 && node -e "require('./db.js')")
          node -e "const { db, init } = require('./db'); init(); console.log('OK users:', db.prepare('SELECT COUNT(*) AS c FROM users').get().c);"
      - name: Start server
        run: |
          node server.js &
          sleep 2
      - name: Health check
        run: |
          curl -fsS http://localhost:3000/ && echo "OK"
          curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"role":"admin","username":"admin","password":"admin"}' | grep -q token && echo "login OK"
